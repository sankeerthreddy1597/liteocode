name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build packages/cli/src/index.tsx --compile --target bun-linux-x64    --outfile dist/liteocode-linux-x64
          bun build packages/cli/src/index.tsx --compile --target bun-linux-arm64  --outfile dist/liteocode-linux-arm64
          bun build packages/cli/src/index.tsx --compile --target bun-darwin-x64   --outfile dist/liteocode-darwin-x64
          bun build packages/cli/src/index.tsx --compile --target bun-darwin-arm64 --outfile dist/liteocode-darwin-arm64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/liteocode-*
          generate_release_notes: true
