name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: liteocode-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: liteocode-linux-arm64
          - runner: macos-13
            target: bun-darwin-x64
            asset: liteocode-darwin-x64
          - runner: macos-latest
            target: bun-darwin-arm64
            asset: liteocode-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build packages/cli/src/index.tsx --compile --target ${{ matrix.target }} --outfile ${{ matrix.asset }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
